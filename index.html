<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS Assessment Manager</title>
<!-- Third-party Libraries -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
:root {
  --bg: #f8f8f6;
  --card: rgba(255, 255, 255, 0.88);
  --text: #172033;
  --muted: #667085;
  --line: rgba(230, 234, 240, 0.92);
  --brand: #5b5cf0;
  --brand-hover: #4849d4;
  --good: #087443;
  --danger: #b42318;
  --shadow: 0 16px 42px rgba(16, 24, 40, 0.12);
  --radius: 12px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  
  /* Dual background wallpaper configuration */
  background-image: 
    linear-gradient(rgba(15, 23, 42, 0.25), rgba(15, 23, 42, 0.25)),
    url("image1.jpg"), 
    url("image2.jpg");
  background-position: center center, left top, right top;
  background-size: cover, 50% 100%, 50% 100%;
  background-repeat: no-repeat, no-repeat, no-repeat;
  background-attachment: fixed, fixed, fixed;
  
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

/* Layout Container */
.app-container {
  width: 100%;
  max-width: 960px;
  background: var(--card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 32px;
}

header {
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 16px;
}

header h1 {
  margin: 0 0 6px 0;
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text);
}

header p {
  margin: 0;
  color: var(--muted);
  font-size: 0.95rem;
}

/* Dropzone & Inputs */
.upload-zone {
  border: 2px dashed var(--brand);
  background: rgba(91, 92, 240, 0.04);
  border-radius: var(--radius);
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease;
  margin-bottom: 24px;
}

.upload-zone:hover {
  background: rgba(91, 92, 240, 0.08);
  border-color: var(--brand-hover);
}

.upload-zone p {
  margin: 8px 0 0;
  font-size: 0.9rem;
  color: var(--muted);
}

input[type="file"] {
  display: none;
}

/* Controls & Buttons */
.controls {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}

.btn {
  background-color: var(--brand);
  color: #ffffff;
  border: none;
  padding: 10px 18px;
  font-size: 0.9rem;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s ease;
}

.btn:hover {
  background-color: var(--brand-hover);
}

.btn-secondary {
  background-color: transparent;
  color: var(--text);
  border: 1px solid var(--line);
}

.btn-secondary:hover {
  background-color: rgba(0, 0, 0, 0.04);
}

/* Data Table Panel */
.table-wrapper {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #ffffff;
}

table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.9rem;
}

th, td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
}

th {
  background-color: rgba(248, 248, 246, 0.8);
  color: var(--muted);
  font-weight: 600;
}

tr:last-child td {
  border-bottom: none;
}

/* Mobile Responsiveness */
@media (max-width: 768px) {
  body {
    background-position: center center, center top, center bottom;
    background-size: cover, 100% 50%, 100% 50%;
    padding: 12px;
  }
  
  .app-container {
    padding: 20px;
  }
  
  .controls {
    flex-direction: column;
  }
}
</style>
</head>
<body>

<main class="app-container">
  <header>
    <h1>AWS Assessment Manager</h1>
    <p>Upload documents, view report files, and process technical assessments.</p>
  </header>

  <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
    <strong>Click to upload assessment files</strong>
    <p>Supports PDF, DOCX, XLSX, and ZIP packages</p>
    <input type="file" id="fileInput" multiple accept=".pdf,.docx,.xlsx,.zip">
  </div>

  <div class="controls">
    <button class="btn" id="processBtn">Process Files</button>
    <button class="btn btn-secondary" id="clearBtn">Clear Queue</button>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>File Name</th>
          <th>Type</th>
          <th>Size</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="fileTableBody">
        <tr>
          <td colspan="4" style="text-align:center; color: var(--muted); padding: 24px;">
            No files uploaded yet.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<script>
  // File upload input listener example
  const fileInput = document.getElementById('fileInput');
  const tableBody = document.getElementById('fileTableBody');

  fileInput.addEventListener('change', (e) => {
    const files = e.target.files;
    if (!files.length) return;

    tableBody.innerHTML = '';
    Array.from(files).forEach(file => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${file.name}</strong></td>
        <td>${file.name.split('.').pop().toUpperCase()}</td>
        <td>${(file.size / 1024).toFixed(1)} KB</td>
        <td style="color: var(--good);">Ready</td>
      `;
      tableBody.appendChild(tr);
    });
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    fileInput.value = '';
    tableBody.innerHTML = `
      <tr>
        <td colspan="4" style="text-align:center; color: var(--muted); padding: 24px;">
          No files uploaded yet.
        </td>
      </tr>
    `;
  });
</script>

</body>
</html>
