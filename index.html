<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWS Assessment Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg: #f8f8f6;
  --card: rgba(255, 255, 255, 0.85);
  --text: #172033;
  --muted: #667085;
  --line: rgba(230, 234, 240, 0.92);
  --brand: #5b5cf0;
  --brand2: #7c3aed;
  --good: #087443;
  --danger: #b42318;
  --shadow: 0 16px 42px rgba(16, 24, 40, 0.12);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  color: var(--text);
  position: relative;
  background-color: #0f172a;
}

/* Background Slider Container */
.bg-slideshow {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: -2;
  overflow: hidden;
  pointer-events: none;
}

.bg-slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0;
  will-change: opacity, transform;
}

.bg-slide-1 {
  background-image: url("Gemini_Generated_Image_rdnz2drdnz2drdnz.jpg");
  animation: crossfadeSlide1 16s infinite ease-in-out;
}

.bg-slide-2 {
  background-image: url("Gemini_Generated_Image_yjs1enyjs1enyjs1.jpg");
  animation: crossfadeSlide2 16s infinite ease-in-out;
}

/* Glassmorphism Overlay */
.bg-overlay {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: -1;
  background: radial-gradient(circle at 50% 30%, rgba(248, 248, 246, 0.45), rgba(248, 248, 246, 0.8)),
              linear-gradient(135deg, rgba(91, 92, 240, 0.08), rgba(124, 58, 237, 0.12));
  backdrop-filter: blur(14px) saturate(120%);
  -webkit-backdrop-filter: blur(14px) saturate(120%);
  pointer-events: none;
}

/* Smooth Crossfade Keyframes */
@keyframes crossfadeSlide1 {
  0%   { opacity: 0; transform: scale(1.0); }
  10%  { opacity: 1; }
  45%  { opacity: 1; }
  55%  { opacity: 0; transform: scale(1.06); }
  100% { opacity: 0; transform: scale(1.0); }
}

@keyframes crossfadeSlide2 {
  0%   { opacity: 0; transform: scale(1.06); }
  45%  { opacity: 0; transform: scale(1.06); }
  55%  { opacity: 1; }
  90%  { opacity: 1; transform: scale(1.0); }
  100% { opacity: 0; transform: scale(1.06); }
}
</style>
</head>
<body>

<!-- Dynamic Background Markup -->
<div class="bg-slideshow">
  <div class="bg-slide bg-slide-1"></div>
  <div class="bg-slide bg-slide-2"></div>
</div>
<div class="bg-overlay"></div>

</body>
</html>
