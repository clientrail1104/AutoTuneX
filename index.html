<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWS Assessment Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg: #f8f8f6;
  --card: rgba(255, 255, 255, 0.90);
  --text: #172033;
  --muted: #667085;
  --line: rgba(230, 234, 240, 0.92);
  --brand: #5b5cf0;
  --brand2: #7c3aed;
  --good: #087443;
  --danger: #b42318;
  --shadow: 0 16px 42px rgba(16, 24, 40, 0.10);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  color: var(--text);
  background: var(--bg);
  position: relative;
}

/* Background Image Switcher Styles */
.bg-slideshow {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
}

.bg-slide {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0;
  transition: opacity 2.5s ease-in-out;
}

.bg-slide.active {
  opacity: 1;
}
</style>
</head>
<body>

  <!-- Background Slideshow Container -->
  <div class="bg-slideshow">
    <div class="bg-slide active" style="background-image: linear-gradient(rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.16)), url('Gemini_Generated_Image_rdnz2drdnz2drdnz.jpg');"></div>
    <div class="bg-slide" style="background-image: linear-gradient(rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.16)), url('Gemini_Generated_Image_yjs1enyjs1enyjs1.jpg');"></div>
  </div>

  <!-- Background Transition Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const slides = document.querySelectorAll('.bg-slide');
      if (slides.length > 1) {
        let currentIndex = 0;
        const displayDuration = 7000; // Switches every 7 seconds (2.5s crossfade transition)

        setInterval(function() {
          slides[currentIndex].classList.remove('active');
          currentIndex = (currentIndex + 1) % slides.length;
          slides[currentIndex].classList.add('active');
        }, displayDuration);
      }
    });
  </script>

</body>
</html>
