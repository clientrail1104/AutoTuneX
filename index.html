<style>
:root{
--bg:#f8f8f6;
--card:rgba(255,255,255,.90);
--text:#172033;
--muted:#667085;
--line:rgba(230,234,240,.92);
--brand:#5b5cf0;
--brand2:#7c3aed;
--good:#087443;
--danger:#b42318;
--shadow:0 16px 42px rgba(16,24,40,.10)
}
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
color:var(--text);
position:relative;
background-color: var(--bg);
}

/* Background Slider Wrapper */
.bg-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}

/* Background Layers for Smooth Opacity Crossfade */
.bg-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0;
  transition: opacity 2.5s ease-in-out; /* Controls transition speed */
}

.bg-layer.active {
  opacity: 1;
}

/* Gradient overlay to maintain content readability */
.bg-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.16));
  z-index: 1;
}
</style>
</head>
<body>

<!-- Background Image Transition Layers -->
<div class="bg-container">
  <div id="bg1" class="bg-layer active"></div>
  <div id="bg2" class="bg-layer"></div>
  <div class="bg-overlay"></div>
</div>

let currentIndex = 0;
let activeLayer = 1;

const layer1 = document.getElementById('bg1');
const layer2 = document.getElementById('bg2');

// Load initial image
layer1.style.backgroundImage = `url("${bgImages[0]}")`;

function rotateBackground() {
  currentIndex = (currentIndex + 1) % bgImages.length;
  const nextImage = bgImages[currentIndex];

  if (activeLayer === 1) {
    layer2.style.backgroundImage = `url("${nextImage}")`;
    layer2.classList.add('active');
    layer1.classList.remove('active');
    activeLayer = 2;
  } else {
    layer1.style.backgroundImage = `url("${nextImage}")`;
    layer1.classList.add('active');
    layer2.classList.remove('active');
    activeLayer = 1;
  }
}

// Rotates background image every 7 seconds
setInterval(rotateBackground, 7000);
</script>
